<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="김비서">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>업무 프로세스 — 김비서</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
    }

    /* Tab Navigation */
    .tab-nav {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e7eb;
      padding: 0 32px;
      display: flex;
      gap: 2px;
      position: sticky;
      top: 0;
      z-index: 100;
      overflow-x: auto;
      scrollbar-width: none;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 16px;
      height: 44px;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-item:hover { color: #6366f1; }
    .tab-item.active { color: #6366f1; border-bottom-color: #6366f1; }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      gap: 20px;
    }
    .content-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e1e2e;
    }
    .content-sub {
      font-size: 14px;
      color: #6b7280;
      margin-top: -12px;
    }
    .svg-wrap {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(99,102,241,0.1);
      padding: 40px 48px;
      display: inline-block;
    }
    .svg-wrap img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <nav class="tab-nav">
    <a href="dashboard.html"      class="tab-item">🏠 대시보드</a>
    <a href="meeting-result.html" class="tab-item">📋 회의록</a>
    <a href="chart.html"          class="tab-item">📊 매출 현황</a>
    <a href="diagram.html"        class="tab-item">🔄 업무 프로세스</a>
    <a href="report.html"         class="tab-item">🔍 사이트 분석</a>
  </nav>

  <div class="content">
    <div class="content-title">🔄 업무 프로세스</div>
    <div class="content-sub">기획 → 제작 → 검토 → 배포 → 분석</div>
    <div class="svg-wrap">
      <img src="diagram.svg" alt="업무 프로세스 다이어그램" width="800" height="200">
    </div>
  </div>

  <script>
    const _p = location.pathname.split('/').pop();
    document.querySelectorAll('.tab-item').forEach(a => {
      if (a.getAttribute('href') === _p) a.classList.add('active');
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
